kind = "web"
previewPath = "/"
title = "CineLive"
version = "1.0.0"
id = "artifacts/cinelive"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19930

[services.development]
run = "pnpm --filter @workspace/cinelive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinelive", "run", "build" ]
publicDir = "artifacts/cinelive/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19930"
BASE_PATH = "/"
